[project]
name = "ttft-harness"
version = "0.1.0"
description = "TTFT measurement harness and calibration for vLLM prefix caching"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27",
    "numpy>=1.26",
]

[project.optional-dependencies]
plots = ["matplotlib>=3.8"]

[tool.uv]
package = false # scripts only, nothing to build/install
